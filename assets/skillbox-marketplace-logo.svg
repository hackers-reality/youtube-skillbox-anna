<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">YouTube Skillbox</title>
  <desc id="desc">A play button paired with a rising measured-performance curve.</desc>
  <defs>
    <linearGradient id="shell" x1="72" y1="38" x2="438" y2="478" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24201e"/><stop offset="1" stop-color="#111113"/>
    </linearGradient>
    <linearGradient id="signal" x1="132" y1="146" x2="384" y2="367" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff645c"/><stop offset="1" stop-color="#df252b"/>
    </linearGradient>
