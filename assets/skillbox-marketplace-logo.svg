  <path d="m143 359 55-45 49 18 65-75 59 20" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="10" filter="url(#glow)"/>
  <circle cx="143" cy="359" r="8" fill="#fff"/><circle cx="198" cy="314" r="8" fill="#fff"/><circle cx="247" cy="332" r="8" fill="#fff"/><circle cx="312" cy="257" r="8" fill="#fff"/><circle cx="371" cy="277" r="8" fill="#fff"/>
