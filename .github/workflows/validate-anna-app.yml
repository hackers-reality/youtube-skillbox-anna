name: Validate Anna Skillbox App

on:
  push:
    branches:
      - feat/anna-skillbox-studio-redesign
      - feat/creator-operating-system
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check frontend module syntax
        shell: bash
        run: |
          cp bundle/app.js /tmp/skillbox-app.mjs
          node --check /tmp/skillbox-app.mjs
          node --check bundle/anna-tool-runtime.mjs
          node bundle/anna-tool-runtime.test.mjs
          node bundle/frontend-regression.test.mjs
          node --check bundle/anna-tool-ids.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Anna CLI
        run: npm install --global @anna-ai/cli

      - name: Validate Anna manifests, tool IDs and Host API calls
        run: anna-app validate --strict

      - name: Run deterministic creator-tool tests
        run: python -m unittest discover -s executas/youtube-skillbox -p "test_*.py" -v

      - name: Validate app and Executa JSON manifests
        shell: bash
        run: |
          python -m json.tool app.json > /dev/null
          python -m json.tool manifest.json > /dev/null
          python -m json.tool executas/youtube-skillbox/manifest.json > /dev/null
          python -m json.tool executas/youtube-skillbox/executa.json > /dev/null

      - name: Validate HTML parsing
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Validator(HTMLParser):
              def error(self, message):
                  raise RuntimeError(message)

          parser = Validator()
          parser.feed(Path("bundle/index.html").read_text(encoding="utf-8"))
          parser.close()
          print("bundle/index.html parsed")
          PY
