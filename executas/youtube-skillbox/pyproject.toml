[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-dev-youtube-skillbox"
version = "0.1.0"
description = "Executa for the youtube-skillbox Anna App"
requires-python = ">=3.10"

[project.scripts]
"tool-dev-youtube-skillbox" = "youtube_skillbox_plugin:main"

[tool.setuptools]
py-modules = ["youtube_skillbox_plugin"]
