[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillbox-core"
version = "0.5.0"
description = "Executa for the YouTube Skillbox Anna App — evidence-backed YouTube research via the open-source YouTube Skillbox engine."
requires-python = ">=3.10"
dependencies = [
    "youtube-skillbox>=0.4.14",
]

[project.scripts]
"skillbox-core" = "youtube_skillbox_plugin:main"

[tool.setuptools]
py-modules = ["youtube_skillbox_plugin"]




